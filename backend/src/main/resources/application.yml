# Base configuration. Everything environment-specific or secret comes from environment variables;
# see deploy/.env.example. Profiles: dev, test, demo, prod.
spring:
  application:
    name: standpos
  threads:
    virtual:
      enabled: true
  datasource:
    # Runtime role: not a table owner, no BYPASSRLS.
    url: ${STANDPOS_DB_URL:jdbc:postgresql://localhost:5432/standpos}
    username: ${STANDPOS_DB_APP_USER:standpos_app}
    password: ${STANDPOS_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${STANDPOS_DB_POOL_SIZE:10}
  flyway:
    # Migrations run as the schema owner.
    user: ${STANDPOS_DB_OWNER_USER:standpos_owner}
    password: ${STANDPOS_DB_OWNER_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Omitted booleans and numbers take their defaults; bean validation then reports the real problems.
      fail-on-null-for-primitives: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: ${STANDPOS_SESSION_TIMEOUT:12h}
      cookie:
        name: SP_SESSION
        http-only: true
        secure: ${STANDPOS_SECURE_COOKIES:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

logging:
  structured:
    format:
      console: ecs

standpos:
  security:
    secure-cookies: ${STANDPOS_SECURE_COOKIES:true}
  bootstrap:
    on-startup: false
    tenant-name: ${STANDPOS_BOOTSTRAP_TENANT_NAME:}
    venue-name: ${STANDPOS_BOOTSTRAP_VENUE_NAME:}
    owner-name: ${STANDPOS_BOOTSTRAP_OWNER_NAME:}
    owner-email: ${STANDPOS_BOOTSTRAP_OWNER_EMAIL:}
    owner-password: ${STANDPOS_BOOTSTRAP_OWNER_PASSWORD:}
    owner-pin: ${STANDPOS_BOOTSTRAP_OWNER_PIN:}
