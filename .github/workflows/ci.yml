name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (unit, integration, Flyway migrations on PostgreSQL 17)
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Images (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: backend, dockerfile: backend/Dockerfile }
          - { name: web, dockerfile: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image.name }} for both architectures (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^STANDPOS_BOOTSTRAP_OWNER_PIN=$/STANDPOS_BOOTSTRAP_OWNER_PIN=1234/' deploy/.env
      - name: Start the stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Bootstrap the first tenant
        run: docker compose -f deploy/docker-compose.yml run --rm backend --bootstrap
      - name: Health, PWA shell and owner login through Caddy
        run: |
          set -e
          curl -fsSk https://localhost/actuator/health | grep -q '"UP"'
          curl -fsSk https://localhost/ | grep -q '<div id="root">'
          curl -fsSk https://localhost/manifest.webmanifest | grep -q StandPOS
          jar=$(mktemp)
          curl -fsSk -c "$jar" -b "$jar" https://localhost/api/v1/auth/csrf > /dev/null
          token=$(awk '$6 == "XSRF-TOKEN" { print $7 }' "$jar")
          curl -fsSk -c "$jar" -b "$jar" -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d '{"email":"owner@example.org","password":"change-me-owner-login"}' \
            https://localhost/api/v1/auth/login | grep -q '"kind":"USER"'
          curl -fsSk -b "$jar" https://localhost/api/v1/venues | grep -q 'Bar oratorio'
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
